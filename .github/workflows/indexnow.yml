name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar al despliegue de Netlify
        run: sleep 120
      - name: Avisar a IndexNow
        run: scripts/indexnow.sh
